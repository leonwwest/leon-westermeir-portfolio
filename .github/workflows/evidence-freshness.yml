name: Evidence freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: evidence-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Compare evidence snapshot with public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c56f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify evidence against GitHub main and latest releases
        run: npm run verify:evidence -- --remote
